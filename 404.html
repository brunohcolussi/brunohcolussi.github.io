<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página Não Encontrada | Bruno H. Colussi</title>
  <meta name="theme-color" content="#FFFFFF">
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">Bruno H. Colussi</a>
    </div>
  </header>

  <main id="conteudo-principal" class="container error-page-container">
    <p class="error-code">404</p>
    <h1 class="section-title">Página não encontrada</h1>
    <p class="error-message">O endereço solicitado não existe ou foi removido.</p>
    <a href="index.html" class="btn btn-primary">Voltar para a página inicial</a>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Bruno H. Colussi.</p>
    </div>
  </footer>
</body>
</html>
